<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="800" fill="#ffffff"/>
<text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Sơ đồ đấu nối phần cứng Robot Xiaozhi — WeAct ESP32-S3-A (OLED SSD1306)</text>

<!-- MCU Box -->
<rect x="490" y="70" width="300" height="600" rx="14" fill="#1b1f24" stroke="#000" stroke-width="2"/>
<text x="640" y="350" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">WeAct</text>
<text x="640" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">ESP32-S3-A</text>
<text x="640" y="402" text-anchor="middle" font-size="15" font-weight="400" fill="#ffffff">N16R8</text>
<rect x="606" y="620" width="68" height="26" rx="5" fill="#8c959f"/>
<text x="640" y="666" text-anchor="middle" font-size="13" fill="#57606a">USB-C native (nạp + Serial)</text>

<!-- LEFT: I2C BUS (OLED, MPU6050, VL53L0X) -->
<rect x="60" y="90" width="240" height="156" rx="10" fill="#f6f8fa" stroke="#0c8599" stroke-width="2.5"/>
<text x="72" y="112" font-size="16" font-weight="700" fill="#0c8599">Bus I2C (Chung)</text>
<text x="72" y="132" font-size="13" fill="#57606a">OLED + MPU6050 + VL53L0X</text>

<line x1="300" y1="160" x2="490" y2="160" stroke="#0c8599" stroke-width="3"/>
<circle cx="300" cy="160" r="5" fill="#0c8599"/>
<circle cx="490" cy="160" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="165" text-anchor="end" font-size="14" fill="#1f2328">SDA</text>
<text x="504" y="165" font-size="14" font-weight="700" fill="#ffffff">GPIO8</text>

<line x1="300" y1="188" x2="490" y2="188" stroke="#0c8599" stroke-width="3"/>
<circle cx="300" cy="188" r="5" fill="#0c8599"/>
<circle cx="490" cy="188" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="193" text-anchor="end" font-size="14" fill="#1f2328">SCL</text>
<text x="504" y="193" font-size="14" font-weight="700" fill="#ffffff">GPIO9</text>
<text x="72" y="218" font-size="12.5" fill="#57606a">⚡ VCC → 3V3 · GND → GND</text>

<!-- LEFT: INMP441 -->
<rect x="60" y="270" width="240" height="188" rx="10" fill="#f6f8fa" stroke="#c2255c" stroke-width="2.5"/>
<text x="72" y="292" font-size="16" font-weight="700" fill="#c2255c">Micro INMP441 (I2S0)</text>

<line x1="300" y1="330" x2="490" y2="330" stroke="#c2255c" stroke-width="3"/>
<circle cx="300" cy="330" r="5" fill="#c2255c"/>
<circle cx="490" cy="330" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="335" text-anchor="end" font-size="14" fill="#1f2328">SCK</text>
<text x="504" y="335" font-size="14" font-weight="700" fill="#ffffff">GPIO15</text>

<line x1="300" y1="362" x2="490" y2="362" stroke="#c2255c" stroke-width="3"/>
<circle cx="300" cy="362" r="5" fill="#c2255c"/>
<circle cx="490" cy="362" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="367" text-anchor="end" font-size="14" fill="#1f2328">WS</text>
<text x="504" y="367" font-size="14" font-weight="700" fill="#ffffff">GPIO16</text>

<line x1="300" y1="394" x2="490" y2="394" stroke="#c2255c" stroke-width="3"/>
<circle cx="300" cy="394" r="5" fill="#c2255c"/>
<circle cx="490" cy="394" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="399" text-anchor="end" font-size="14" fill="#1f2328">SD (DIN)</text>
<text x="504" y="399" font-size="14" font-weight="700" fill="#ffffff">GPIO17</text>
<text x="72" y="430" font-size="12.5" fill="#57606a">⚡ L/R → GND · VDD → 3V3</text>

<!-- LEFT: Touch & Battery -->
<rect x="60" y="490" width="240" height="156" rx="10" fill="#f6f8fa" stroke="#7048e8" stroke-width="2.5"/>
<text x="72" y="512" font-size="16" font-weight="700" fill="#7048e8">Cảm biến Khác</text>

<line x1="300" y1="540" x2="490" y2="540" stroke="#7048e8" stroke-width="3"/>
<circle cx="300" cy="540" r="5" fill="#7048e8"/>
<circle cx="490" cy="540" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="545" text-anchor="end" font-size="14" fill="#1f2328">Touch Sensor</text>
<text x="504" y="545" font-size="14" font-weight="700" fill="#ffffff">GPIO1</text>

<line x1="300" y1="572" x2="490" y2="572" stroke="#7048e8" stroke-width="3"/>
<circle cx="300" cy="572" r="5" fill="#7048e8"/>
<circle cx="490" cy="572" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="288" y="577" text-anchor="end" font-size="14" fill="#1f2328">ADC (Đo pin)</text>
<text x="504" y="577" font-size="14" font-weight="700" fill="#ffffff">GPIO2</text>
<text x="72" y="614" font-size="12.5" fill="#57606a">⚡ Touch VCC → 3V3</text>
<text x="72" y="634" font-size="12.5" fill="#57606a">⚡ Pin qua cầu phân áp 1/2</text>

<!-- RIGHT: 4x MG90S Servos -->
<rect x="980" y="90" width="240" height="220" rx="10" fill="#f6f8fa" stroke="#e67700" stroke-width="2.5"/>
<text x="992" y="112" font-size="16" font-weight="700" fill="#e67700">4x Động cơ Servo MG90S</text>

<line x1="980" y1="150" x2="790" y2="150" stroke="#e67700" stroke-width="3"/>
<circle cx="980" cy="150" r="5" fill="#e67700"/>
<circle cx="790" cy="150" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="992" y="155" font-size="14" fill="#1f2328">Servo 1 (Pan)</text>
<text x="776" y="155" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">GPIO4</text>

<line x1="980" y1="182" x2="790" y2="182" stroke="#e67700" stroke-width="3"/>
<circle cx="980" cy="182" r="5" fill="#e67700"/>
<circle cx="790" cy="182" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="992" y="187" font-size="14" fill="#1f2328">Servo 2 (Tilt)</text>
<text x="776" y="187" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">GPIO5</text>

<line x1="980" y1="214" x2="790" y2="214" stroke="#e67700" stroke-width="3"/>
<circle cx="980" cy="214" r="5" fill="#e67700"/>
<circle cx="790" cy="214" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="992" y="219" font-size="14" fill="#1f2328">Servo 3 (Tay trái)</text>
<text x="776" y="219" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">GPIO6</text>

<line x1="980" y1="246" x2="790" y2="246" stroke="#e67700" stroke-width="3"/>
<circle cx="980" cy="246" r="5" fill="#e67700"/>
<circle cx="790" cy="246" r="6" fill="#ffd43b" stroke="#000" stroke-width="1"/>
<text x="992" y="251" font-size="14" fill="#1f2328">Servo 4 (Tay phải)</text>
<text x="776" y="251" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">GPIO7</text>

<text x="992" y="280" font-size="12.5" fill="#c2255c">⚡ CẤP NGUỒN 5V RIÊNG (Buck)</text>
<text x="992" y="300" font-size="12.5" fill="#57606a">⚡ Tuyệt đối không lấy 5V từ ESP32</text>

<!-- Notes at the bottom -->
<text x="60" y="730" font-size="14" fill="#1f2328">• Nguồn: Các module logic, cảm biến, micro lấy 3V3 của board ESP32.</text>
<text x="60" y="752" font-size="14" fill="#1f2328">• Động cơ Servo lấy dòng đỉnh rất cao, bắt buộc qua mạch hạ áp (Buck 5V 3A) nối trực tiếp vào pin 2S.</text>
<text x="60" y="774" font-size="14" fill="#1f2328">• TẤT CẢ chân GND (âm nguồn) của Servo, Buck, Cảm biến và Board ESP32 phải được nối chung lại với nhau (Star Grounding).</text>
</svg>
