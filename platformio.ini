;===========================================================================================
; PlatformIO Project Configuration for Xiaozhi Desktop Robot
; Board: WeAct ESP32-S3 CoreBoard N16R8 (16MB Flash, 8MB PSRAM OPI)
; Display: ILI9341 (240x320 SPI, Adafruit_ILI9341)
; Audio: INMP441 (I2S Mic) + PCM5100A (I2S DAC/Amp)
; Actuators: 4x Servos (FL: GPIO7, FR: GPIO4 [360], RL: GPIO6, RR: GPIO5)
; Sensors: VL53L0X ToF (I2C 0x29) + MPU6050 IMU (I2C 0x68/0x69)
;
; Toan bo so chan duoc khai bao DUY NHAT o day (section [env]); code chi dung #ifndef fallback.
;===========================================================================================

[platformio]
default_envs = test_servo

; -----------------------------------------------------------------------------------------
; CAU HINH CHUNG cho moi env (PlatformIO tu dong ke thua section [env])
; -----------------------------------------------------------------------------------------
[env]
; Ghim phien ban: code dung API Arduino core 2.x (ledcSetup/ledcAttachPin, driver/i2s.h).
; Len core 3.x (pioarduino) se khong build duoc.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; Serial -> UART0 qua CH343 (COM18) cho moi env, de dung chung 1 cong monitor
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; --- Display: ILI9341 (240x320, FSPI) ---
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=47
    -DTFT_SPI_HZ=27000000

    ; --- 4 Servo ---
    -DSERVO_PIN_FL=7
    -DSERVO_PIN_FR=4
    -DSERVO_PIN_RL=6
    -DSERVO_PIN_RR=5
    -DSERVO_FR_IS_360=1

    ; --- Audio I2S full-duplex (BCLK/WS dung chung) ---
    -DI2S_PIN_BCLK=16
    -DI2S_PIN_WS=17
    -DI2S_PIN_DIN=14
    -DI2S_PIN_DOUT=15

    ; --- I2C Sensors ---
    -DI2C_SDA_PIN=8
    -DI2C_SCL_PIN=9
    -DTOF_XSHUT_PIN=21

    ; --- Buttons & Status ---
    -DPIN_BOOT_BTN=0
    -DSTATUS_LED_PIN=48
    -DWAKE_BTN_PIN=1

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------------------
; ENV TEST SENSORS: I2C Scanner, Laser ToF & MPU6050
; -----------------------------------------------------------------------------------------
[env:test_sensors]
build_src_filter = -<*> +<test_sensors.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit_VL53L0X @ ^1.2.5

; -----------------------------------------------------------------------------------------
; ENV TEST SERVO: chan doan, test goc va calibrate 4 chan servo
; -----------------------------------------------------------------------------------------
[env:test_servo]
build_src_filter = -<*> +<test_servo.cpp>

; -----------------------------------------------------------------------------------------
; ENV GOC: Audio + Display + Demo Poses
; -----------------------------------------------------------------------------------------
[env:esp32s3_xiaozhi]
build_src_filter = -<*> +<main.cpp>
