;===========================================================================================
; PlatformIO Project Configuration for Xiaozhi Desktop Robot
; Board: WeAct ESP32-S3 CoreBoard N16R8 (16MB Flash, 8MB PSRAM OPI)
; Display: ILI9341 (240x320 SPI, Adafruit_ILI9341)
; Audio: INMP441 (I2S Mic) + PCM5100A (I2S DAC/Amp)
; Actuators: 4x Servos (FL: GPIO7, FR: GPIO4 [360], RL: GPIO6, RR: GPIO5)
; Sensors: VL53L0X ToF (I2C 0x29) + MPU6050 IMU (I2C 0x68/0x69)
;
; Toan bo so chan duoc khai bao DUY NHAT o day (section [env]); code chi dung #ifndef fallback.
;===========================================================================================

[platformio]
default_envs = voice_parrot

; -----------------------------------------------------------------------------------------
; CAU HINH CHUNG cho moi env (PlatformIO tu dong ke thua section [env])
; -----------------------------------------------------------------------------------------
[env]
; Ghim phien ban: code dung API Arduino core 2.x (ledcSetup/ledcAttachPin, driver/i2s.h).
; Len core 3.x (pioarduino) se khong build duoc.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; Serial -> UART0 qua CH343 (COM18) cho moi env, de dung chung 1 cong monitor
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; --- Display: ILI9341 (240x320, FSPI) ---
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=47
    -DTFT_SPI_HZ=27000000

    ; --- 4 Servo 180° (tat ca 180°, khong con servo 360) ---
    -DSERVO_PIN_FL=6
    -DSERVO_PIN_FR=5
    -DSERVO_PIN_RL=7
    -DSERVO_PIN_RR=4

    ; --- Audio I2S full-duplex (BCLK/WS dung chung) ---
    -DI2S_PIN_BCLK=16
    -DI2S_PIN_WS=17
    -DI2S_PIN_DIN=14
    -DI2S_PIN_DOUT=15

    ; --- I2C Sensors ---
    -DI2C_SDA_PIN=8
    -DI2C_SCL_PIN=9
    -DTOF_XSHUT_PIN=21

    ; --- Buttons & Status ---
    -DPIN_BOOT_BTN=0
    -DSTATUS_LED_PIN=48
    -DWAKE_BTN_PIN=1

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------------------
; ENV TEST SENSORS: I2C Scanner, Laser ToF & MPU6050
; -----------------------------------------------------------------------------------------
[env:test_sensors]
build_src_filter = -<*> +<test_sensors.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit_VL53L0X @ ^1.2.5

; -----------------------------------------------------------------------------------------
; ENV ALL OFF: Tat toan bo GPIO, LEDC, LED
; -----------------------------------------------------------------------------------------
[env:all_off]
build_src_filter = -<*> +<all_off.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST SERVO6: Test rieng servo tren GPIO 6
; -----------------------------------------------------------------------------------------
[env:test_servo6]
build_src_filter = -<*> +<test_servo6.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST LED48: Chi bat LED WS2812 GPIO48, tat toan bo chan con lai
; -----------------------------------------------------------------------------------------
[env:test_led48]
build_src_filter = -<*> +<test_led48.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST SERVO: chan doan, test goc va calibrate 4 chan servo
; -----------------------------------------------------------------------------------------
[env:test_servo]
build_src_filter = -<*> +<test_servo.cpp>

; -----------------------------------------------------------------------------------------
; ENV GOC: Audio + Display + Demo Poses
; -----------------------------------------------------------------------------------------
[env:esp32s3_xiaozhi]
build_src_filter = -<*> +<main.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST DISPLAY: Test rieng man hinh ILI9341 SPI (Mau sac, RoboEyes, Text)
; -----------------------------------------------------------------------------------------
[env:test_display]
build_src_filter = -<*> +<test_display.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST I2C SCAN: Quet I2C tren chan 41 & 42
; -----------------------------------------------------------------------------------------
[env:test_i2c_scan]
build_src_filter = -<*> +<test_i2c_scan.cpp>

; -----------------------------------------------------------------------------------------
; ENV TEST PCB ALL: OLED SSD1306 (I2C 1, 2) + MAX98357A & INMP441 (I2S 11, 12, 14, 13)
; Cấu hình cho ESP32-S3 CLONE (Chuẩn Flash QIO/DIO, không bắt buộc Octal PSRAM)
; -----------------------------------------------------------------------------------------
[env:test_pcb_all]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.partitions = default.csv
build_src_filter = -<*> +<test_pcb_all.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPIN_OLED_SDA=2
    -DPIN_OLED_SCL=1
    -DPIN_I2S_BCLK=11
    -DPIN_I2S_WS=12
    -DPIN_I2S_DIN=14
    -DPIN_I2S_DOUT=13
    -DPIN_BOOT_BTN=0
    -DPIN_MOTOR_IN1=4
    -DPIN_MOTOR_IN2=5
    -DPIN_MOTOR_IN3=6
    -DPIN_MOTOR_IN4=7
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------------------
; ENV TEST OLED: Test riêng OLED SSD1306 trên GPIO 1 (SCL) và GPIO 2 (SDA)
; Dành riêng cho ESP32-S3 CLONE: Dùng qio_qspi, hỗ trợ native USB CDC
; -----------------------------------------------------------------------------------------
[env:test_oled]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.partitions = default.csv
build_src_filter = -<*> +<test_oled.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_OLED_SDA=2
    -DPIN_OLED_SCL=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------------------
; ENV TEST SPEAKER: Test rieng loa MAX98357A (BCLK=11, LRC=12, DIN=13), ngat toan bo motor
; Cau hinh cho ESP32-S3 CLONE: DUNG DIO Flash, qio_qspi, ho tro native USB CDC
; -----------------------------------------------------------------------------------------
[env:test_speaker]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.partitions = default.csv
build_src_filter = -<*> +<test_speaker.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPIN_OLED_SDA=2
    -DPIN_OLED_SCL=1
    -DPIN_I2S_BCLK=11
    -DPIN_I2S_WS=12
    -DPIN_I2S_DOUT=13
    -DPIN_BOOT_BTN=0
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; -----------------------------------------------------------------------------------------
; ENV VOICE PARROT: Robot nhại giọng (Talking Tom / Chipmunk / Normal / Deep Robot)
; -----------------------------------------------------------------------------------------
[env:voice_parrot]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.partitions = default.csv
build_src_filter = -<*> +<voice_parrot.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPIN_OLED_SDA=1
    -DPIN_OLED_SCL=2
    -DPIN_I2S_BCLK=11
    -DPIN_I2S_WS=12
    -DPIN_I2S_DIN=14
    -DPIN_I2S_DOUT=13
    -DPIN_BOOT=0
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

