;===========================================================================================
; PlatformIO Project Configuration for Xiaozhi Desktop Robot
; Board: WeAct ESP32-S3 CoreBoard N16R8 (16MB Flash, 8MB PSRAM OPI)
; Display: GMT147SPI (ST7789V3, 172x320 IPS)
; Audio: INMP441 (I2S Mic) + MAX98357A (I2S DAC/Amp)
; Sensors: VL53L0X / VL53L1X ToF Distance Sensor
; Actuators: 4x Servos (180 deg)
;===========================================================================================

[platformio]
default_envs = esp32s3_xiaozhi

[env:esp32s3_xiaozhi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    
    ; --- Display: ILI9341 (240x320) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DUSE_FSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=47
    
    ; BL noi truc tiep vao 3.3V
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=20000000
    
    ; --- Xiaozhi Audio Pinout Mapping ---
    -DMIC_I2S_SCK=16
    -DMIC_I2S_WS=17
    -DMIC_I2S_SD=14
    -DSPK_I2S_BCLK=16
    -DSPK_I2S_LRC=17
    -DSPK_I2S_DIN=15
    
    ; --- Xiaozhi Sensors & Actuators ---
    -DTOF_I2C_SDA=8
    -DTOF_I2C_SCL=9
    -DTOF_XSHUT=21
    -DSERVO_PIN_1=4
    -DSERVO_PIN_2=5
    -DSERVO_PIN_3=6
    -DSERVO_PIN_4=7
    
    ; --- Status & Controls ---
    -DSTATUS_LED_PIN=48
    -DWAKE_BTN_PIN=1

lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
